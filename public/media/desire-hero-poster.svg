<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="desire-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B24A66" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7A1F3D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4A1024" stop-opacity="1"/>
    </radialGradient>
    <filter id="velvet-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.48  0 1 0 0 0.12  0 0 1 0 0.24  0 0 0 0.25 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend mode="multiply" in="SourceGraphic" result="blend"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#desire-glow)"/>
  <!-- Skein loop geometry -->
  <g filter="url(#velvet-filter)">
    <circle cx="400" cy="400" r="280" fill="none" stroke="#F4DCE2" stroke-width="12" stroke-dasharray="14 8" opacity="0.4"/>
    <ellipse cx="400" cy="400" rx="240" ry="180" fill="none" stroke="#E8B4BC" stroke-width="28" transform="rotate(-25 400 400)" opacity="0.6"/>
    <ellipse cx="400" cy="400" rx="210" ry="150" fill="none" stroke="#7A1F3D" stroke-width="40" transform="rotate(35 400 400)"/>
    <ellipse cx="400" cy="400" rx="160" ry="120" fill="none" stroke="#B24A66" stroke-width="32" transform="rotate(-10 400 400)"/>
    <ellipse cx="400" cy="400" rx="90" ry="70" fill="#4A1024" opacity="0.8"/>
  </g>
  <text x="400" y="390" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFF6F8" text-anchor="middle" letter-spacing="4">DESIRE</text>
  <text x="400" y="430" font-family="sans-serif" font-size="14" fill="#F4DCE2" opacity="0.8" text-anchor="middle" letter-spacing="2">VELVET MERINO &amp; SILK</text>
</svg>
