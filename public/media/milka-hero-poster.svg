<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="milka-glow" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#E7D8BF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#B98A5E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6B4A2C" stop-opacity="1"/>
    </radialGradient>
    <filter id="milka-texture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.42  0 1 0 0 0.29  0 0 1 0 0.17  0 0 0 0.2 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend mode="multiply" in="SourceGraphic" result="blend"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#milka-glow)"/>
  <g filter="url(#milka-texture)">
    <circle cx="400" cy="400" r="290" fill="none" stroke="#F3E7D6" stroke-width="14" stroke-dasharray="16 10" opacity="0.5"/>
    <ellipse cx="400" cy="400" rx="250" ry="190" fill="none" stroke="#E7D8BF" stroke-width="26" transform="rotate(45 400 400)" opacity="0.7"/>
    <ellipse cx="400" cy="400" rx="200" ry="140" fill="none" stroke="#6B4A2C" stroke-width="36" transform="rotate(-30 400 400)"/>
    <ellipse cx="400" cy="400" rx="140" ry="100" fill="none" stroke="#B98A5E" stroke-width="30" transform="rotate(15 400 400)"/>
    <ellipse cx="400" cy="400" rx="80" ry="60" fill="#3A2716" opacity="0.75"/>
  </g>
  <text x="400" y="390" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFBF4" text-anchor="middle" letter-spacing="4">MILKA</text>
  <text x="400" y="430" font-family="sans-serif" font-size="14" fill="#F3E7D6" opacity="0.9" text-anchor="middle" letter-spacing="2">MILK-TEA COMBED COTTON</text>
</svg>
