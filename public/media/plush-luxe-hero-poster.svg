<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="plush-glow" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4A2A5A" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#3A2350" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1B0E26" stop-opacity="1"/>
    </radialGradient>
    <filter id="plush-texture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0.3  0 1 0 0 0.1  0 0 1 0 0.4  0 0 0 0.3 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
      <feBlend mode="multiply" in="SourceGraphic" result="blend"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#plush-glow)"/>
  <g filter="url(#plush-texture)">
    <circle cx="400" cy="400" r="290" fill="none" stroke="#C9A227" stroke-width="6" stroke-dasharray="18 12" opacity="0.65"/>
    <ellipse cx="400" cy="400" rx="250" ry="190" fill="none" stroke="#E7DEF0" stroke-width="24" transform="rotate(30 400 400)" opacity="0.6"/>
    <ellipse cx="400" cy="400" rx="200" ry="145" fill="none" stroke="#4A2A5A" stroke-width="44" transform="rotate(-40 400 400)"/>
    <ellipse cx="400" cy="400" rx="145" ry="105" fill="none" stroke="#C9A227" stroke-width="12" transform="rotate(10 400 400)" opacity="0.8"/>
    <ellipse cx="400" cy="400" rx="90" ry="65" fill="#241430" opacity="0.85"/>
  </g>
  <text x="400" y="390" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#F7F1FF" text-anchor="middle" letter-spacing="4">PLUSH LUXE</text>
  <text x="400" y="430" font-family="sans-serif" font-size="14" fill="#C9A227" opacity="0.9" text-anchor="middle" letter-spacing="2">MIDNIGHT PLUM &amp; BRASS</text>
</svg>
