<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TheYarnHook — Instagram Story (1080×1920)</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Manrope', sans-serif; background: #241430; color: #F7F1FF; }
    .story { width: 1080px; height: 1920px; padding: 180px 96px 220px; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at 50% 35%, #4A2A5A 0%, #241430 75%); }
    .top { text-align: center; }
    .tag { display: inline-block; border: 1px solid rgba(231,199,102,0.5); color: #E7C766; padding: 10px 24px; border-radius: 999px; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 32px; }
    h1 { font-family: 'Fraunces', serif; font-size: 96px; font-weight: 400; line-height: 0.96; }
    p { margin-top: 24px; font-family: 'Fraunces', serif; font-style: italic; font-size: 36px; color: #E7DEF0; }
    .orb { width: 680px; height: 680px; margin: 0 auto; border-radius: 999px; overflow: hidden; border: 3px solid #E7C766; box-shadow: 0 36px 80px rgba(0,0,0,0.45); }
    .orb img { width: 100%; height: 100%; object-fit: cover; }
    .bottom { text-align: center; }
    .cta { display: inline-block; background: #E7C766; color: #1A1613; padding: 24px 56px; border-radius: 999px; font-size: 26px; font-weight: 700; }
    .sub { margin-top: 20px; font-size: 20px; color: rgba(247,241,255,0.7); }
  </style>
</head>
<body>
  <div class="story">
    <div class="top">
      <div class="tag">New Drop · Plush Luxe</div>
      <h1>Midnight, but make it soft.</h1>
      <p>Velvet chenille &amp; a thread of brass.</p>
    </div>
    <div class="orb"><img src="../../../public/images/products/yarn-plush.webp" alt="Plush Luxe yarn" /></div>
    <div class="bottom">
      <div class="cta">Shop Plush Luxe</div>
      <div class="sub">Free shipping across India over ₹999</div>
    </div>
  </div>
</body>
</html>
