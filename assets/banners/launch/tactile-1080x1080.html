<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TheYarnHook — Instagram Post (1080×1080)</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Manrope', sans-serif; background: #FBE3CC; color: #5A2A0C; }
    .canvas { position: relative; width: 1080px; height: 1080px; padding: 90px; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at 80% 20%, #F2C879 0%, #FBE3CC 62%); }
    .brand { font-family: 'Fraunces', serif; font-size: 32px; letter-spacing: -0.02em; }
    .frame { width: 580px; height: 580px; margin: 0 auto; border-radius: 36px; overflow: hidden; box-shadow: 0 32px 60px -20px rgba(90,42,12,0.3); border: 12px solid #FFFDF8; }
    .frame img { width: 100%; height: 100%; object-fit: cover; }
    .footer { display: flex; align-items: flex-end; justify-content: space-between; }
    h2 { font-family: 'Fraunces', serif; font-size: 60px; font-weight: 400; line-height: 1; }
    h2 em { font-style: italic; color: #9A4A16; }
    .pill { background: #5A2A0C; color: #FFF8F0; padding: 16px 32px; border-radius: 999px; font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="brand">TheYarnHook</div>
    <div class="frame"><img src="../../../public/images/products/yarn-arm-knit.webp" alt="Souffle & Chunky Yarn" /></div>
    <div class="footer">
      <div>
        <h2>Light as a <em>whisk</em>.</h2>
      </div>
      <span class="pill">Explore Souffle · ₹399+</span>
    </div>
  </div>
</body>
</html>
